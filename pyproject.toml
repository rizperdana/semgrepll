[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semgrepll"
version = "1.1.0"
description = "Local semantic code search - hybrid SQLite/LanceDB, works offline with Ollama"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ayre", email = "ayre@rubicon.dev"}
]
keywords = ["semantic", "search", "code", "ollama", "lancedb", "embedding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.28.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
lance = ["lancedb>=0.10.0", "pyarrow>=14.0.0"]
all = ["lancedb>=0.10.0", "pyarrow>=14.0.0"]
dev = ["pytest", "black", "mypy"]

[project.scripts]
semgrep = "semgrepll.cli:main"

[project.urls]
Homepage = "https://github.com/rizperdana/semgrepll"
Repository = "https://github.com/rizperdana/semgrepll"
Issues = "https://github.com/rizperdana/semgrepll/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["semgrepll*"]
